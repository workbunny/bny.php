      - name: Build bny
        run: v -os linux . -o bny

      - name: Build cli
        run: v -os linux script/cli.v -o script/cli

      - name: Add PHP 8.2
        run: |
          ./bny add 8.2
          ./bny php -m

      - name: Add composer
