      #     cd test/cli
      #     ../../bny composer create-project workerman/webman:~2.0 --no-interaction
      #     cp webman/start.php webman/index.php
      #     cd webman
      #     ../../../bny compile . -o webman

      - name: Compile demo project
        run: |
          cd test/cli/demo
          ../../../bny compile .
