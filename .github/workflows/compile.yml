  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS arm64
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos-arm64' || github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v
          cd v
