name: Build and Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows-x64
          - linux-x64
          - linux-arm64
          - macos-arm64
      r2_access_key_id:
        description: 'R2 访问密钥 ID (Access Key ID)'
        required: true
        type: string
      r2_secret_access_key:
        description: 'R2 私密访问密钥 (Secret Access Key)'
        required: true
        type: string

jobs:

  build-windows-x64:
    runs-on: windows-latest
    name: Build Windows x86_64
    env:
      R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -fsSL https://github.com/vlang/v/releases/latest/download/v_windows.zip -o v.zip
          Expand-Archive -Force v.zip -DestinationPath C:\v

      - name: Install mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Inject R2 credentials
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
        run: |
          $p = 'common/client.v'
          $c = [System.IO.File]::ReadAllText($p)
          $c = $c.Replace('__R2_ACCESS_KEY_ID__', $env:R2_ACCESS_KEY_ID)
          $c = $c.Replace('__R2_SECRET_ACCESS_KEY__', $env:R2_SECRET_ACCESS_KEY)
          [System.IO.File]::WriteAllText($p, $c)

      - name: Build bny
        run: |
          & C:\v\v\v.exe -os windows . -o bny.exe
      
      - name: Set bny.exe icon
        run: |
          & script/rcedit-x64.exe bny.exe --set-icon icon.ico

      - name: Build cli tools
        run: |
          & C:\v\v\v.exe -os windows script/cli.v -o script/cli.exe
          & C:\v\v\v.exe -cc gcc -os windows script/win32.v -o script/win32.exe

      - name: Prepare release package
        run: |
          New-Item -ItemType Directory -Force -Path release/bny/script
          Copy-Item bny.exe release/bny/
          Copy-Item icon.png release/bny/ -ErrorAction SilentlyContinue
          Copy-Item README.md release/bny/
          Copy-Item script/enigmavbconsole.exe release/bny/script/
          Copy-Item script/rcedit-x64.exe release/bny/script/
          Copy-Item script/cli.exe release/bny/script/
          Copy-Item script/win32.exe release/bny/script/
          Copy-Item script/android release/bny/script/ -Recurse -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bny-windows-x86_64
          path: release
          if-no-files-found: error

  build-linux-x64:
    runs-on: ubuntu-latest
    name: Build Linux x86_64
    env:
      R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v
          cd v
          make
          sudo ./v symlink

      - name: Inject R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
        run: |
          sed -i "s/__R2_ACCESS_KEY_ID__/$R2_ACCESS_KEY_ID/g; s/__R2_SECRET_ACCESS_KEY__/$R2_SECRET_ACCESS_KEY/g" common/client.v

      - name: Build bny
        run: v -os linux . -o bny

      - name: Build cli
        run: |
          v -os linux script/cli.v -o script/cli

      - name: Prepare release package
        run: |
          mkdir -p release/bny/script
          cp bny release/bny/
          cp icon.png release/bny/ || true
          cp README.md release/bny/
          cp script/appimagetool-x86_64.AppImage release/bny/script/
          cp script/runtime-x86_64 release/bny/script/
          cp script/cli release/bny/script/
          cp -r script/android release/bny/script/android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bny-linux-x86_64
          path: release
          if-no-files-found: error

  build-linux-arm64:
    runs-on: Ubuntu-24.04-arm
    name: Build Linux aarch64
    env:
      R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v
          cd v
          make
          sudo ./v symlink

      - name: Inject R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
        run: |
          sed -i "s/__R2_ACCESS_KEY_ID__/$R2_ACCESS_KEY_ID/g; s/__R2_SECRET_ACCESS_KEY__/$R2_SECRET_ACCESS_KEY/g" common/client.v

      - name: Build bny
        run: v -os linux . -o bny

      - name: Build cli
        run: |
          v -os linux script/cli.v -o script/cli

      - name: Prepare release package
        run: |
          mkdir -p release/bny/script
          cp bny release/bny/
          cp icon.png release/bny/ || true
          cp README.md release/bny/
          cp script/appimagetool-aarch64.AppImage release/bny/script/
          cp script/runtime-aarch64 release/bny/script/
          cp script/cli release/bny/script/
          cp -r script/android release/bny/script/android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bny-linux-aarch64
          path: release
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS arm64
    env:
      R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
      R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install V
        run: |
          git clone --depth=1 https://github.com/vlang/v
          cd v
          make
          sudo ./v symlink

      - name: Inject R2 credentials
        env:
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.r2_access_key_id }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.r2_secret_access_key }}
        run: |
          sed -i '' "s/__R2_ACCESS_KEY_ID__/$R2_ACCESS_KEY_ID/g; s/__R2_SECRET_ACCESS_KEY__/$R2_SECRET_ACCESS_KEY/g" common/client.v

      - name: Build bny
        run: v -os macos . -o bny
      
      - name: Build cli
        run: |
          v -os macos script/cli.v -o script/cli

      - name: Prepare release package
        run: |
          mkdir -p release/bny/script
          cp bny release/bny/
          cp icon.png release/bny/ || true
          cp README.md release/bny/
          cp script/cli release/bny/script/
          cp -r script/android release/bny/script/android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bny-macos-arm64
          path: release
          if-no-files-found: error
